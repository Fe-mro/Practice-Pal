// =====================================================================
// Routine tracker: direction matrix 1A–4B × intervallic families
// =====================================================================
const FAMILIES = [
  { semi: 1, groups: 1, key: 'half' }, { semi: 2, groups: 2, key: 'whole' }, { semi: 3, groups: 3, key: 'min3' },
  { semi: 4, groups: 4, key: 'maj3' }, { semi: 5, groups: 1, key: 'fourth' }, { semi: 6, groups: 6, key: 'tritone' },
  { semi: 7, groups: 1, key: 'fifth' }
];
const RT_SCALES = ['major', 'melmin', 'harmmin', 'harmmaj', 'bebopMaj', 'bebopDom', 'dim', 'penta'];
const RT_DIA = ['int3', 'int4', 'int5', 'int6', 'int7', 'triads', 'sevenths'];
const RT_TRIADS = ['maj0', 'maj1', 'maj2', 'min0', 'min1', 'min2'];
const RT_CHORDS = ['maj7', 'm7', '7', 'm7b5', 'dim7', 'maj7#5', 'm(maj7)'];
const RT_PERMS = (() => {
  const out = [];
  const perm = (arr, pre) => { if (!arr.length) { out.push(pre); return; } arr.forEach((x, i) => perm(arr.slice(0, i).concat(arr.slice(i + 1)), pre + x)); };
  perm(['1', '3', '5', '7'], '');
  return out;
})();
let rt = null;
let rtInfoOpen = new Set();
function getRt() {
  if (!rt) {
    try { rt = JSON.parse(localStorage.getItem('ppRoutine') || 'null'); } catch (e) { rt = null; }
    rt = Object.assign({ sel: {}, prog: {} }, rt || {});
    rt.sel = Object.assign({ stage: 'diatonic', dia: 'int3', diaScale: 'major', scale: 'major', triad: 'maj0', chord: 'maj7', inv: 0, perm: '1537', permChord: 'm7' }, rt.sel);
  }
  return rt;
}
function saveRt() { localStorage.setItem('ppRoutine', JSON.stringify(rt)); }
function rtSet(key, value) { const r = getRt(); r.sel[key] = key === 'inv' ? parseInt(value, 10) : value; rtInfoOpen.clear(); saveRt(); renderRoutine(); }
function rtSubjectKey() {
  const s = getRt().sel;
  switch (s.stage) {
    case 'diatonic': return 'dia:' + s.dia + ':' + s.diaScale;
    case 'scale': return 'scale:' + s.scale;
    case 'triad': return 'triad:' + s.triad;
    case 'seventh': return 'chord:' + s.chord + ':' + s.inv;
    default: return 'order:' + s.permChord + ':' + s.perm;
  }
}
function permDown(p) { return p.split('').reverse().join(''); }
function rtSubjectLabel() {
  const s = getRt().sel;
  switch (s.stage) {
    case 'diatonic': return t('rtDiaTypes')[s.dia] + ' (' + t('rtScales')[s.diaScale] + ')';
    case 'scale': return t('rtScale') + ': ' + t('rtScales')[s.scale];
    case 'triad': return t('rtTriads')[s.triad];
    case 'seventh': return s.chord + ' · ' + t('rtInvs')[s.inv];
    default: return s.permChord + ' · ' + t('rtPermInfo', { u: s.perm, d: permDown(s.perm) });
  }
}
function rtRows() {
  const s = getRt().sel;
  if (s.stage === 'diatonic') {
    return keySequence(5, 0, 1).seq.map(pc => ({ id: 'k' + pc, label: noteName(pc), pc }));
  }
  const rows = [];
  FAMILIES.forEach(f => { for (let k = 0; k < f.groups; k++) rows.push({ id: 'f' + f.semi + '-' + k, label: t('rtFam')[f.key] + (f.groups > 1 ? ' ' + (k + 1) : ''), semi: f.semi, start: k }); });
  return rows;
}
function rtCell(rowId, j) { const p = getRt().prog[rtSubjectKey()] || {}; return p[rowId + '|' + j] || 0; }
function rtToggleCell(rowId, j) {
  const r = getRt(), key = rtSubjectKey();
  const p = r.prog[key] || (r.prog[key] = {});
  const v = ((p[rowId + '|' + j] || 0) + 1) % 3;
  if (v) p[rowId + '|' + j] = v; else delete p[rowId + '|' + j];
  saveRt(); renderRoutineTable();
}
function rtToggleInfo(rowId) { if (rtInfoOpen.has(rowId)) rtInfoOpen.delete(rowId); else rtInfoOpen.add(rowId); renderRoutineTable(); }
function rtToUnit(rowId, btn) {
  const row = rtRows().find(r => r.id === rowId);
  if (!row) return;
  let first = 0;
  while (first < 8 && rtCell(rowId, first) === 2) first++;
  if (first >= 8) first = 0;
  const s = getRt().sel;
  let u;
  if (s.stage === 'diatonic') {
    u = normalizeUnit({ name: rtSubjectLabel() + ' · ' + t('from') + ' ' + row.label + ' · ' + MATRIX[first] + '–4B', minutes: 10,
      tip: t('rtTipDia'), cycle: { semi: 5, start: row.pc, dir: 1, mode: 'manual', bars: 4 }, matrix: 'diatonic', matrixStart: first });
  } else {
    u = normalizeUnit({ name: rtSubjectLabel() + ' · ' + row.label + ' · ' + MATRIX[first] + '–4B', minutes: 10,
      tip: t('rtTipFam'), cycle: { semi: row.semi, start: row.start, dir: 1, mode: 'manual', bars: 4, only: true }, matrix: 'family', matrixStart: first });
  }
  units.push(u);
  renderUnits(); renderSummary(); renderSectionJumper(); updateTimerDisplay();
  if (btn) { btn.classList.add('added'); btn.textContent = '✓'; setTimeout(() => { btn.classList.remove('added'); btn.textContent = '+'; }, 1200); }
}
function rtOpts(list, labels, cur) { return list.map(v => '<option value="' + esc(v) + '"' + (String(v) === String(cur) ? ' selected' : '') + '>' + esc(labels ? labels[v] : v) + '</option>').join(''); }
function renderRoutine() {
  const s = getRt().sel;
  const sel = (label, key, opts) => '<label class="field"><span>' + esc(label) + '</span><select onchange="rtSet(\'' + key + '\', this.value)">' + opts + '</select></label>';
  let h = sel(t('rtStage'), 'stage', rtOpts(['diatonic', 'scale', 'triad', 'seventh', 'order'], t('rtStages'), s.stage));
  if (s.stage === 'diatonic') h += sel(t('rtMaterial'), 'dia', rtOpts(RT_DIA, t('rtDiaTypes'), s.dia)) + sel(t('rtScale'), 'diaScale', rtOpts(RT_SCALES, t('rtScales'), s.diaScale));
  else if (s.stage === 'scale') h += sel(t('rtScale'), 'scale', rtOpts(RT_SCALES, t('rtScales'), s.scale));
  else if (s.stage === 'triad') h += sel(t('rtMaterial'), 'triad', rtOpts(RT_TRIADS, t('rtTriads'), s.triad));
  else if (s.stage === 'seventh') h += sel(t('rtChord'), 'chord', rtOpts(RT_CHORDS, null, s.chord)) + sel(t('rtInv'), 'inv', rtOpts([0, 1, 2, 3], t('rtInvs'), s.inv));
  else h += sel(t('rtChord'), 'permChord', rtOpts(RT_CHORDS, null, s.permChord)) +
    sel(t('rtPerm'), 'perm', RT_PERMS.map(p => '<option value="' + p + '"' + (p === s.perm ? ' selected' : '') + '>' + p + ' / ' + permDown(p) + '</option>').join(''));
  document.getElementById('rtSel').innerHTML = h;
  document.getElementById('rtSubject').innerHTML = esc(rtSubjectLabel()) + '<small>' + esc(t(s.stage === 'diatonic' ? 'rtHintDia' : 'rtHintFam')) + '</small>';
  renderRoutineTable();
}
function renderRoutineTable() {
  const rows = rtRows(), dia = getRt().sel.stage === 'diatonic';
  let done = 0, wip = 0;
  let h = '<thead><tr><th>' + esc(dia ? t('rtKeyCol') : t('rtFamCol')) + '</th>' + MATRIX.map(c => '<th title="' + esc(matrixText(c)) + '">' + c + '</th>').join('') + '<th></th></tr></thead><tbody>';
  rows.forEach(r => {
    h += '<tr><th><button class="rt-row" onclick="rtToggleInfo(\'' + r.id + '\')">' + esc(r.label) + ' ▾</button></th>';
    for (let j = 0; j < 8; j++) {
      const v = rtCell(r.id, j); if (v === 2) done++; else if (v === 1) wip++;
      h += '<td><button class="rt-cell s' + v + '" onclick="rtToggleCell(\'' + r.id + '\',' + j + ')" aria-label="' + esc(r.label + ' ' + MATRIX[j]) + '">' + (v === 2 ? '✅' : v === 1 ? '🔸' : '') + '</button></td>';
    }
    h += '<td><button class="rt-add" onclick="rtToUnit(\'' + r.id + '\', this)" title="' + esc(t('rtAddUnit')) + '" aria-label="' + esc(t('rtAddUnit')) + '">+</button></td></tr>';
    if (rtInfoOpen.has(r.id)) {
      let info;
      if (dia) info = esc(t('rtInfoDia', { k: r.label }));
      else {
        const up = keySequence(r.semi, r.start, 1, true).seq.map(noteName).join(' ');
        const down = keySequence(r.semi, r.start, -1, true).seq.map(noteName).join(' ');
        info = '<b>A</b> ' + esc(up) + ' &nbsp;·&nbsp; <b>B</b> ' + esc(down);
      }
      h += '<tr class="rt-info"><td colspan="10">' + info + '</td></tr>';
    }
  });
  h += '</tbody>';
  document.getElementById('rtTable').innerHTML = h;
  const total = rows.length * 8;
  document.getElementById('rtBar').style.width = (done / total * 100) + '%';
  document.getElementById('rtCount').textContent = t('rtProgress', { d: done, n: total, w: wip });
}

function getLog() { try { return JSON.parse(localStorage.getItem('ppLog') || '[]'); } catch (e) { return []; } }
function setLog(log) { localStorage.setItem('ppLog', JSON.stringify(log.slice(-1000))); }
function recordSession() {
  if (totalPracticeMs < 60000) return;
  const entry = {
    id: Date.now(),
    date: new Date().toISOString(),
    preset: presetDisplayName() || '',
    totalSec: Math.round(totalPracticeMs / 1000),
    units: units.map((u, i) => ({ name: displayName(u, i), plannedMin: u.minutes, practicedSec: Math.round((practicedById[u.id] || 0) / 1000) }))
      .filter(x => x.practicedSec > 0)
  };
  const log = getLog(); log.push(entry); setLog(log);
  lastSession = entry;
  renderLog();
}
function fmtMin(sec) {
  if (sec < 60) return fmtTime(sec);
  const m = Math.round(sec / 60);
  if (m < 60) return m + ' ' + t('min');
  return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' ' + t('min');
}
function sumSince(log, ms) { const from = Date.now() - ms; const l = log.filter(e => new Date(e.date).getTime() >= from); return { sec: l.reduce((a, e) => a + e.totalSec, 0), n: l.length }; }
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function renderLog() {
  const log = getLog();
  const todayL = log.filter(e => new Date(e.date).getTime() >= startOfToday());
  const stats = [
    [t('today'), { sec: todayL.reduce((a, e) => a + e.totalSec, 0), n: todayL.length }],
    [t('last7'), sumSince(log, 7 * 864e5)],
    [t('last30'), sumSince(log, 30 * 864e5)]
  ];
  document.getElementById('logStats').innerHTML = stats.map(([l, v]) =>
    '<div class="log-stat"><span>' + esc(l) + '</span><b>' + esc(fmtMin(v.sec)) + '</b><span>' + esc((v.n === 1 ? t('sessions1') : t('sessionsN', { n: v.n }))) + '</span></div>').join('');
  const list = document.getElementById('logList');
  if (!log.length) { list.innerHTML = '<div class="log-empty">' + esc(t('noSessions')) + '</div>'; return; }
  list.innerHTML = log.slice(-50).reverse().map(e =>
    '<details class="log-item"><summary><span class="l-date">' + esc(fmtDate(e.date)) + '</span><span class="l-name">' + esc(e.preset || '–') + '</span><span class="l-total">' + esc(fmtMin(e.totalSec)) + '</span></summary>' +
    '<div class="log-body"><ul>' + e.units.map(u => '<li><span>' + esc(u.name) + '</span><span>' + esc(fmtMin(u.practicedSec)) + ' / ' + u.plannedMin + ' ' + esc(t('min')) + '</span></li>').join('') + '</ul>' +
    '<div class="log-actions"><button class="btn btn-blue btn-small" onclick="shareSessionById(' + e.id + ')">📤 ' + esc(t('shareImage')) + '</button>' +
    '<button class="btn btn-red btn-small" onclick="deleteLogEntry(' + e.id + ')">✕ ' + esc(t('delete')) + '</button></div></div></details>').join('');
}
function deleteLogEntry(id) {
  if (!confirm(t('confirmDeleteEntry'))) return;
  setLog(getLog().filter(e => e.id !== id)); renderLog();
}
function shareSessionById(id) { const e = getLog().find(x => x.id === id); if (e) shareSessionImage(e); }

// ---- Export / import
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function dateStamp() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function exportCsv() {
  const sep = ';', dec = lang === 'de' ? ',' : '.';
  const q = v => { v = String(v == null ? '' : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const rows = [t('csvHeader')];
  getLog().forEach(e => {
    const d = new Date(e.date);
    const day = d.toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-GB'), time = d.toLocaleTimeString(lang === 'de' ? 'de-DE' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
    e.units.forEach(u => rows.push([day, time, e.preset, u.name, u.plannedMin, (u.practicedSec / 60).toFixed(1).replace('.', dec)]));
  });
  const csv = '\uFEFF' + rows.map(r => r.map(q).join(sep)).join('\r\n');
  downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), 'practice-pal-' + dateStamp() + '.csv');
}
const BACKUP_KEYS = ['practicePresets', 'practiceDefault', 'ppProfile', 'ppChecklist', 'ppSettings', 'ppMetro', 'ppLog', 'ppLang', 'ppRoutine'];
function exportBackup() {
  const data = {};
  BACKUP_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v !== null) data[k] = v; });
  const json = JSON.stringify({ app: 'practice-pal', version: 1, exported: new Date().toISOString(), data }, null, 1);
  downloadBlob(new Blob([json], { type: 'application/json' }), 'practice-pal-backup-' + dateStamp() + '.json');
}
function importBackup(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let b;
    try { b = JSON.parse(reader.result); } catch (e) { b = null; }
    if (!b || b.app !== 'practice-pal' || typeof b.data !== 'object') { alert(t('importError')); return; }
    if (!confirm(t('importConfirm', { d: b.exported ? fmtDate(b.exported) : '?' }))) return;
    BACKUP_KEYS.forEach(k => { if (typeof b.data[k] === 'string') localStorage.setItem(k, b.data[k]); else localStorage.removeItem(k); });
    location.reload();
  };
  reader.readAsText(file);
}

// =====================================================================
// Share as image (canvas 1080x1350, drawn synchronously so that
// navigator.share still runs inside the user's tap on iOS)
// =====================================================================
const IMG_W = 1080, IMG_H = 1350;
const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
function imgCanvas() {
  const c = document.createElement('canvas'); c.width = IMG_W; c.height = IMG_H;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, IMG_W, IMG_H);
  g.addColorStop(0, '#0a0a14'); g.addColorStop(0.5, '#131329'); g.addColorStop(1, '#1c1d3a');
  x.fillStyle = g; x.fillRect(0, 0, IMG_W, IMG_H);
  x.fillStyle = '#ffd700'; x.font = '800 44px ' + FONT; x.textBaseline = 'alphabetic';
  x.fillText('♫ Practice Pal', 70, 110);
  x.fillStyle = '#a0a3bd'; x.font = '500 26px ' + FONT;
  x.fillText('practice-pal-wheat.vercel.app', 70, IMG_H - 60);
  return [c, x];
}
function fitText(x, s, maxW) {
  if (x.measureText(s).width <= maxW) return s;
  while (s.length > 1 && x.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}
function rrect(x, X, Y, W, H, r) {
  x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + H, r); x.arcTo(X + W, Y + H, X, Y + H, r);
  x.arcTo(X, Y + H, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath();
}
function dataUrlToBlob(url) {
  const [head, b64] = url.split(','); const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: head.slice(5, head.indexOf(';')) });
}
function shareCanvas(c, name, text) {
  const blob = dataUrlToBlob(c.toDataURL('image/png'));
  let file = null;
  try { file = new File([blob], name, { type: 'image/png' }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'Practice Pal', text }).catch(err => { if (err && err.name !== 'AbortError') downloadBlob(blob, name); });
  } else downloadBlob(blob, name);
  return c;
}
function shareSessionImage(e) {
  if (!e) e = getLog().slice(-1)[0];
  if (!e) { alert(t('noSessions')); return; }
  const [c, x] = imgCanvas();
  x.fillStyle = '#fff'; x.font = '800 64px ' + FONT; x.fillText(t('sessionTitle'), 70, 210);
  x.fillStyle = '#a0a3bd'; x.font = '500 32px ' + FONT; x.fillText(fmtDate(e.date) + (e.preset ? ' · ' + fitText(x, e.preset, 560) : ''), 70, 262);
  // total box
  rrect(x, 70, 310, IMG_W - 140, 190, 28); x.fillStyle = 'rgba(255,255,255,0.06)'; x.fill();
  x.fillStyle = '#ffd700'; x.font = '800 110px ' + FONT; x.textAlign = 'center';
  x.fillText(fmtMin(e.totalSec), IMG_W / 2, 440); x.textAlign = 'left';
  x.fillStyle = '#a0a3bd'; x.font = '600 28px ' + FONT; x.textAlign = 'center'; x.fillText(t('practicedLabel').toUpperCase(), IMG_W / 2, 482); x.textAlign = 'left';
  // units
  const list = e.units.slice(0, 10);
  const maxSec = Math.max(60, ...list.map(u => u.practicedSec));
  let y = 570;
  const rowH = Math.min(68, (IMG_H - 140 - y) / Math.max(1, list.length));
  list.forEach((u, i) => {
    const col = PIE_COLORS[i % PIE_COLORS.length];
    x.fillStyle = '#fff'; x.font = '600 30px ' + FONT;
    x.fillText(fitText(x, u.name, 640), 70, y + 28);
    x.fillStyle = col; x.font = '800 30px ' + FONT; x.textAlign = 'right';
    x.fillText(fmtMin(u.practicedSec), IMG_W - 70, y + 28); x.textAlign = 'left';
    rrect(x, 70, y + 40, IMG_W - 140, 12, 6); x.fillStyle = 'rgba(255,255,255,0.08)'; x.fill();
    rrect(x, 70, y + 40, Math.max(12, (IMG_W - 140) * u.practicedSec / maxSec), 12, 6); x.fillStyle = col; x.fill();
    y += rowH;
  });
  if (e.units.length > 10) { x.fillStyle = '#a0a3bd'; x.font = '500 26px ' + FONT; x.fillText('+ ' + (e.units.length - 10), 70, y + 24); }
  return shareCanvas(c, 'practice-pal-session-' + dateStamp() + '.png', t('sessionTitle') + ': ' + fmtMin(e.totalSec));
}
function shareWeekImage() {
  const log = getLog();
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
    const from = d.getTime(), to = from + 864e5;
    const l = log.filter(e => { const tm = new Date(e.date).getTime(); return tm >= from && tm < to; });
    days.push({ d, sec: l.reduce((a, e) => a + e.totalSec, 0), n: l.length });
  }
  const total = days.reduce((a, d) => a + d.sec, 0), sessions = days.reduce((a, d) => a + d.n, 0);
  const [c, x] = imgCanvas();
  x.fillStyle = '#fff'; x.font = '800 64px ' + FONT; x.fillText(t('weekTitle'), 70, 210);
  x.fillStyle = '#a0a3bd'; x.font = '500 32px ' + FONT;
  x.fillText(days[0].d.toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-GB') + ' – ' + days[6].d.toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-GB'), 70, 262);
  rrect(x, 70, 310, IMG_W - 140, 190, 28); x.fillStyle = 'rgba(255,255,255,0.06)'; x.fill();
  x.textAlign = 'center';
  x.fillStyle = '#ffd700'; x.font = '800 110px ' + FONT; x.fillText(fmtMin(total), IMG_W / 2, 440);
  x.fillStyle = '#a0a3bd'; x.font = '600 28px ' + FONT; x.fillText((t('totalLabel') + ' · ' + (sessions === 1 ? t('sessions1') : t('sessionsN', { n: sessions }))).toUpperCase(), IMG_W / 2, 482);
  // bars
  const top = 600, bottom = 1150, maxSec = Math.max(1800, ...days.map(d => d.sec));
  const slot = (IMG_W - 140) / 7, bw = slot * 0.6;
  days.forEach((d, i) => {
    const cx = 70 + slot * i + slot / 2;
    const h = (bottom - top) * d.sec / maxSec;
    rrect(x, cx - bw / 2, top, bw, bottom - top, 16); x.fillStyle = 'rgba(255,255,255,0.05)'; x.fill();
    if (h > 0) { rrect(x, cx - bw / 2, bottom - Math.max(h, 16), bw, Math.max(h, 16), 16); x.fillStyle = i === 6 ? '#ffd700' : '#00d97e'; x.fill(); }
    x.fillStyle = '#fff'; x.font = '700 26px ' + FONT;
    if (d.sec > 0) x.fillText(Math.round(d.sec / 60) + '′', cx, bottom - Math.max(h, 16) - 14);
    x.fillStyle = '#a0a3bd'; x.font = '600 28px ' + FONT; x.fillText(t('days')[d.d.getDay()], cx, bottom + 44);
  });
  x.textAlign = 'left';
  return shareCanvas(c, 'practice-pal-week-' + dateStamp() + '.png', t('weekTitle') + ': ' + fmtMin(total));
}
function shareProfileImage() {
  const p = getProfile();
  const [c, x] = imgCanvas();
  x.fillStyle = '#fff'; x.font = '800 64px ' + FONT; x.fillText(t('profile'), 70, 210);
  x.fillStyle = '#a0a3bd'; x.font = '500 32px ' + FONT; x.fillText(fmtDate(new Date().toISOString()), 70, 262);
  const cx = IMG_W / 2, cy = 700, R = 300, n = p.cats.length, TAU = Math.PI * 2;
  for (let k = 2; k <= 10; k += 2) {
    x.beginPath(); x.arc(cx, cy, R * k / 10, 0, TAU);
    x.strokeStyle = 'rgba(255,255,255,' + (k === 10 ? 0.4 : 0.12) + ')'; x.lineWidth = 2;
    x.setLineDash(k === 10 ? [] : [4, 8]); x.stroke();
  }
  x.setLineDash([]);
  const snap = p.cmp >= 0 ? p.snaps[p.cmp] : null;
  p.cats.forEach((cat, i) => {
    const a0 = -Math.PI / 2 + i * TAU / n, a1 = a0 + TAU / n, am = (a0 + a1) / 2;
    const col = PIE_COLORS[i % PIE_COLORS.length], r = R * cat.score / 10;
    if (r > 0) {
      x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, r, a0, a1); x.closePath();
      x.globalAlpha = 0.75; x.fillStyle = col; x.fill(); x.globalAlpha = 1;
      x.strokeStyle = col; x.lineWidth = 3; x.stroke();
    }
    x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + R * Math.cos(a0), cy + R * Math.sin(a0));
    x.strokeStyle = 'rgba(255,255,255,0.25)'; x.lineWidth = 2; x.stroke();
    if (snap && cat.name.trim() && snap.scores[cat.name.trim()] !== undefined) {
      const rs = Math.max(2, R * snap.scores[cat.name.trim()] / 10);
      x.beginPath(); x.arc(cx, cy, rs, a0, a1); x.setLineDash([12, 10]); x.strokeStyle = '#fff'; x.lineWidth = 4; x.stroke(); x.setLineDash([]);
    }
    const ca = Math.cos(am), sa = Math.sin(am);
    const lx = cx + (R + 30) * ca, ly = cy + (R + 30) * sa + (sa > 0.3 ? 26 : (sa < -0.3 ? -4 : 10));
    x.textAlign = ca > 0.25 ? 'left' : (ca < -0.25 ? 'right' : 'center');
    x.font = '700 30px ' + FONT;
    const label = fitText(x, (cat.name || '–').trim() || '–', 230);
    const scoreTxt = ' ' + cat.score;
    const lw = x.measureText(label).width, sw = x.measureText(scoreTxt).width;
    let sx = lx;
    if (x.textAlign === 'right') sx = lx - sw; else if (x.textAlign === 'center') sx = lx - (lw + sw) / 2;
    x.textAlign = 'left';
    x.fillStyle = '#fff'; x.fillText(label, sx, ly);
    x.fillStyle = col; x.font = '800 30px ' + FONT; x.fillText(scoreTxt, sx + lw, ly);
  });
  x.beginPath(); x.arc(cx, cy, 6, 0, TAU); x.fillStyle = '#fff'; x.fill();
  x.textAlign = 'center'; x.font = '600 30px ' + FONT;
  const named = p.cats.filter(c2 => c2.name.trim());
  if (named.length) {
    const avg = named.reduce((a, c2) => a + c2.score, 0) / named.length;
    x.fillStyle = '#ffd700'; x.fillText('Ø ' + avg.toFixed(1).replace('.', lang === 'de' ? ',' : '.') + ' / 10', cx, 1130);
  }
  if (snap) { x.fillStyle = '#a0a3bd'; x.font = '500 26px ' + FONT; x.fillText(t('dashedFrom', { d: fmtDate(snap.date) }), cx, 1180); }
  x.textAlign = 'left';
  return shareCanvas(c, 'practice-pal-profil-' + dateStamp() + '.png', t('profile'));
}

// =====================================================================
// Keyboard shortcuts (desktop)
// =====================================================================
document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); if (isRunning && !isPaused) pauseTimer(); else startTimer(); }
  else if (e.key === 'ArrowRight') { if (cyc) { e.preventDefault(); nextKey(true); } }
  else if (e.key === 'm' || e.key === 'M') { const cb = document.getElementById('metronomeToggle'); cb.checked = !cb.checked; toggleMetronome(); }
  else if (e.key === 't' || e.key === 'T') { tapTempo(); }
  else if (e.key === 'f' || e.key === 'F') { nextFocus(); }
  else if (e.key === 'ArrowDown') { if (mtx) { e.preventDefault(); nextMatrix(true); } }
});

// Celebration (applause + fireworks + confetti)
// =====================================================================
function showCelebration() { document.getElementById('celebrationOverlay').classList.add('show'); }
function closeCelebration() {
  document.getElementById('celebrationOverlay').classList.remove('show');
  document.getElementById('fireworksCanvas').classList.remove('show');
  stopFireworks();
  document.querySelectorAll('.confetti-piece').forEach(el => el.remove());
  totalPracticeMs = 0; updateTotalTime();
}
function createConfetti() {
  const colors = ['#ffd700', '#ff6b6b', '#00d97e', '#4d8bff', '#c084fc', '#fb923c', '#06b6d4'];
  for (let i = 0; i < 100; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (Math.random() * 2.5 + 2) + 's';
    piece.style.animationDelay = Math.random() * 1.5 + 's';
    piece.style.width = (Math.random() * 8 + 6) + 'px';
    piece.style.height = (Math.random() * 12 + 10) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(piece);
  }
}
let fireworksCtx = null, fireworksRunning = false, fireworksParticles = [], fireworksRockets = [];
function startFireworks() {
  const canvas = document.getElementById('fireworksCanvas');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  canvas.classList.add('show');
  fireworksCtx = canvas.getContext('2d');
  fireworksRunning = true; fireworksParticles = []; fireworksRockets = [];
  for (let i = 0; i < 12; i++) setTimeout(() => launchRocket(), i * 400 + Math.random() * 200);
  requestAnimationFrame(fireworksLoop);
}
function stopFireworks() { fireworksRunning = false; fireworksParticles = []; fireworksRockets = []; }
function launchRocket() {
  if (!fireworksRunning) return;
  const canvas = document.getElementById('fireworksCanvas');
  const startX = Math.random() * canvas.width, startY = canvas.height;
  const targetY = canvas.height * (0.15 + Math.random() * 0.4);
  fireworksRockets.push({ x: startX, y: startY, targetY, vx: (Math.random() - 0.5) * 2, vy: -Math.sqrt(2 * 0.15 * (startY - targetY)) * 0.9, color: 'hsl(' + (Math.random() * 360) + ', 100%, 60%)', exploded: false });
}
function explodeFirework(x, y, color) {
  const n = 50 + Math.random() * 30;
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i) / n + Math.random() * 0.2, speed = 2 + Math.random() * 4;
    fireworksParticles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, color, life: 1, decay: 0.012 + Math.random() * 0.015, size: 2 + Math.random() * 2 });
  }
}
function fireworksLoop() {
  if (!fireworksRunning) return;
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = fireworksCtx;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  fireworksRockets.forEach(r => {
    if (r.exploded) return;
    r.x += r.vx; r.y += r.vy; r.vy += 0.05;
    ctx.beginPath(); ctx.arc(r.x, r.y, 2, 0, Math.PI * 2); ctx.fillStyle = r.color; ctx.fill();
    ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx, r.y - r.vy);
    ctx.strokeStyle = r.color; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.6; ctx.stroke(); ctx.globalAlpha = 1;
    if (r.y <= r.targetY || r.vy >= 0) { r.exploded = true; explodeFirework(r.x, r.y, r.color); }
  });
  fireworksRockets = fireworksRockets.filter(r => !r.exploded);
  fireworksParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.vx *= 0.99; p.vy *= 0.99; p.life -= p.decay;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life); ctx.fill();
  });
  ctx.globalAlpha = 1;
  fireworksParticles = fireworksParticles.filter(p => p.life > 0);
  if (Math.random() < 0.04) launchRocket();
  requestAnimationFrame(fireworksLoop);
}
window.addEventListener('resize', () => {
  const canvas = document.getElementById('fireworksCanvas');
  if (canvas.classList.contains('show')) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

  });
}
