<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a14">
<title>Practice Pal – Übungstimer für Musiker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-1: #0a0a14;
    --bg-2: #131329;
    --bg-3: #1c1d3a;
    --gold: #ffd700;
    --gold-2: #ffaa00;
    --green: #00d97e;
    --red: #ff4757;
    --blue: #4d8bff;
    --text: #ffffff;
    --text-dim: #a0a3bd;
    --card: rgba(255, 255, 255, 0.06);
    --card-2: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.09);
    --radius: 16px;
  }

  html { -webkit-text-size-adjust: 100%; }
  html, body { min-height: 100%; overflow-x: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%) fixed;
    color: var(--text);
    min-height: 100vh;
    padding: calc(12px + env(safe-area-inset-top)) 14px 40px;
    -webkit-font-smoothing: antialiased;
    line-height: 1.4;
  }

  button, input, select, textarea { font: inherit; color: inherit; }

  /* ===== Header ===== */
  .app-header {
    max-width: 1200px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand h1 {
    color: var(--gold);
    font-size: 1.6em;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
    letter-spacing: 0.5px;
    font-weight: 800;
    line-height: 1.1;
  }
  .subtitle { color: var(--text-dim); font-size: 0.85em; }

  .lang-switch {
    display: flex;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 3px;
    flex-shrink: 0;
  }
  .lang-switch button {
    border: 0;
    background: transparent;
    padding: 7px 14px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.85em;
    color: var(--text-dim);
    cursor: pointer;
    min-height: 36px;
  }
  .lang-switch button.active { background: var(--gold); color: #1a1a1a; }

  /* ===== Layout ===== */
  .layout {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* ===== Buttons ===== */
  .btn {
    border: 0;
    border-radius: 12px;
    padding: 12px 18px;
    font-weight: 700;
    font-size: 1em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    transition: transform 0.08s ease, filter 0.15s ease, background 0.15s ease;
    user-select: none;
    -webkit-user-select: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn:hover { filter: brightness(1.08); }
  .btn-green { background: var(--green); color: #062b1c; }
  .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: #1a1a1a; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-blue { background: var(--blue); color: #fff; }
  .btn-ghost { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--card-border); }
  .btn-small { padding: 8px 12px; font-size: 0.85em; min-height: 38px; border-radius: 10px; }
  .btn-block { width: 100%; }
  .icon-btn {
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    width: 38px; height: 38px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 1em;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.12); }
  .icon-btn.danger:hover { background: rgba(255,71,87,0.25); }
  .icon-btn.on { background: rgba(255,215,0,0.18); border-color: rgba(255,215,0,0.5); }

  /* ===== Inputs ===== */
  input[type=text], input[type=number], select, textarea {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 16px; /* prevents iOS zoom */
    min-height: 42px;
    width: 100%;
    outline: none;
  }
  textarea { resize: vertical; min-height: 64px; line-height: 1.35; }
  input:focus, select:focus, textarea:focus { border-color: var(--gold); }
  select option, select optgroup { background: #1c1d3a; color: #fff; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.8em; color: var(--text-dim); }

  /* ===== Timer ===== */
  .timer-card { text-align: center; padding: 18px 16px; }
  .screen-on { font-size: 0.75em; color: var(--text-dim); margin-bottom: 8px; }
  .current-label { color: var(--text-dim); font-size: 0.8em; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
  .current-practice {
    font-size: 1.35em; color: var(--gold); font-weight: 800; line-height: 1.2;
    margin: 6px 0 4px; min-height: 1.2em; word-break: break-word;
  }
  .current-tip { color: var(--text-dim); font-size: 0.85em; max-width: 520px; margin: 0 auto; min-height: 0; }
  .countdown {
    font-size: 4.2em; font-weight: 800; margin: 10px 0 6px;
    font-family: -apple-system, 'SF Mono', 'Menlo', monospace;
    text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  .countdown.motivating { color: var(--green); animation: gentle-glow 1.2s ease-in-out infinite; }
  .countdown-emoji { display: inline-block; font-size: 0.5em; margin-left: 12px; vertical-align: middle; animation: emoji-bounce 0.5s ease-in-out; }
  @keyframes gentle-glow { 0%,100% { text-shadow: 0 0 20px rgba(0,217,126,0.3); } 50% { text-shadow: 0 0 35px rgba(0,217,126,0.6); } }
  @keyframes emoji-bounce { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.4); opacity: 1; } 100% { transform: scale(1); } }

  .progress { height: 8px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; margin: 8px 0 10px; }
  .progress > div { height: 100%; width: 100%; background: linear-gradient(90deg, var(--green), var(--gold)); transition: width 0.3s linear; }
  .total { color: var(--text-dim); font-size: 0.85em; }
  .total b { color: #fff; font-variant-numeric: tabular-nums; margin-left: 4px; }

  /* Key cycle */
  .keycycle {
    margin: 14px 0 4px;
    background: rgba(77,139,255,0.10);
    border: 1px solid rgba(77,139,255,0.35);
    border-radius: 14px;
    padding: 12px;
  }
  .kc-head { display: flex; justify-content: space-between; font-size: 0.78em; color: var(--text-dim); gap: 8px; text-align: left; }
  .kc-main { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 4px 0 8px; }
  .kc-key { font-size: 3.4em; font-weight: 900; color: #fff; line-height: 1; text-shadow: 0 0 24px rgba(77,139,255,0.7); min-width: 1.6em; }
  .kc-key.pop { animation: key-pop 0.3s ease-out; }
  @keyframes key-pop { 0% { transform: scale(0.7); opacity: 0.4; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  .kc-next { color: var(--text-dim); font-size: 0.9em; text-align: left; }
  .kc-next b { color: #fff; font-size: 1.3em; display: block; }
  .kc-chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .kc-chip { min-width: 34px; padding: 4px 6px; border-radius: 8px; font-size: 0.8em; font-weight: 700; background: rgba(255,255,255,0.06); color: var(--text-dim); }
  .kc-chip.done { background: rgba(0,217,126,0.18); color: var(--green); }
  .kc-chip.now { background: var(--blue); color: #fff; }
  .kc-sep { width: 8px; }
  .kc-hint { font-size: 0.75em; color: var(--gold); margin-top: 8px; }

  .controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .controls .btn { min-width: 96px; }
  .section-jumper { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
  .section-jumper button {
    border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: var(--text-dim);
    border-radius: 99px; padding: 5px 10px; font-size: 0.75em; cursor: pointer; max-width: 180px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .section-jumper button.active { background: rgba(255,215,0,0.18); color: var(--gold); border-color: rgba(255,215,0,0.5); }
  .section-jumper button.done { color: var(--green); }
  .shortcuts { margin-top: 12px; font-size: 0.72em; color: var(--text-dim); }
  kbd { background: rgba(255,255,255,0.1); border-radius: 4px; padding: 1px 5px; font-family: inherit; font-size: 0.95em; }

  /* ===== Metronome ===== */
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card-title { font-weight: 800; font-size: 1.05em; }
  .switch { position: relative; width: 54px; height: 30px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: rgba(255,255,255,0.15); border-radius: 99px; cursor: pointer; transition: 0.2s; }
  .switch span::before { content: ''; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
  .switch input:checked + span { background: var(--green); }
  .switch input:checked + span::before { transform: translateX(24px); }

  .bpm-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0 6px; }
  .bpm-display { text-align: center; min-width: 96px; }
  .bpm-display b { font-size: 2.6em; font-weight: 800; color: var(--gold); line-height: 1; font-variant-numeric: tabular-nums; display: block; }
  .bpm-display small { color: var(--text-dim); font-size: 0.75em; letter-spacing: 1px; }
  .bpm-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 99px; background: rgba(255,255,255,0.12); outline: none; margin: 8px 0; }
  .bpm-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); cursor: pointer; box-shadow: 0 0 10px rgba(255,215,0,0.5); }
  .bpm-slider::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--gold); cursor: pointer; border: 0; }

  .beat-dots { display: flex; gap: 8px; justify-content: center; margin: 8px 0 4px; min-height: 18px; }
  .beat-dot { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.12); transition: background 0.06s, transform 0.06s; }
  .beat-dot.accent { border: 2px solid rgba(255,215,0,0.6); }
  .beat-dot.hit { background: var(--gold); transform: scale(1.25); }
  .beat-dot.hit.muted { background: rgba(160,163,189,0.7); }
  .metro-status { text-align: center; font-size: 0.8em; color: var(--text-dim); min-height: 1.3em; }
  .metro-status.muted { color: var(--gold); font-weight: 700; }

  .metro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .metro-grid .full { grid-column: 1 / -1; }
  .gap-box { border: 1px dashed rgba(255,215,0,0.35); border-radius: 12px; padding: 10px; }
  .gap-box .gap-title { font-size: 0.85em; font-weight: 700; margin-bottom: 2px; }
  .gap-box .gap-sub { font-size: 0.75em; color: var(--text-dim); margin-bottom: 8px; }
  .gap-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metro-bottom { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  .volume { display: flex; align-items: center; gap: 8px; flex: 1; }
  .volume-bar { flex: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; }
  .volume-bar div { height: 100%; background: var(--green); width: 70%; }

  /* ===== Collapsible sections ===== */
  .section-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; gap: 10px; }
  .section-header h2 { font-size: 1.05em; font-weight: 800; }
  .section-header .hint { color: var(--text-dim); font-size: 0.8em; font-weight: 500; margin-left: 6px; }
  .toggle-icon { transition: transform 0.2s; color: var(--text-dim); }
  .collapsed .toggle-icon { transform: rotate(-90deg); }
  .collapsed .section-body { display: none; }
  .section-body { margin-top: 12px; }

  /* ===== Units ===== */
  .units { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .unit { background: var(--card-2); border: 1px solid var(--card-border); border-radius: 14px; padding: 10px; transition: border-color 0.2s, background 0.2s; }
  .unit.current { border-color: var(--gold); background: rgba(255,215,0,0.07); }
  .unit.completed { opacity: 0.6; }
  .unit-top { display: flex; gap: 8px; align-items: center; }
  .unit-num { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,215,0,0.15); color: var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85em; flex-shrink: 0; }
  .unit-name { flex: 1; min-width: 0; }
  .unit-min { width: 74px !important; flex-shrink: 0; text-align: center; }
  .unit-min-label { color: var(--text-dim); font-size: 0.8em; flex-shrink: 0; }
  .unit-bottom { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .unit-tags { display: flex; gap: 5px; flex-wrap: wrap; flex: 1 1 160px; min-width: 0; overflow: hidden; }
  .tag { font-size: 0.72em; padding: 3px 8px; border-radius: 99px; background: rgba(255,255,255,0.07); color: var(--text-dim); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .tag.cycle { background: rgba(77,139,255,0.18); color: #a9c4ff; }
  .tag.bpm { background: rgba(255,215,0,0.13); color: var(--gold); }
  .unit-actions { display: flex; gap: 4px; }
  .unit-details { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--card-border); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .unit-details .full { grid-column: 1 / -1; }

  /* ===== Presets ===== */
  .preset-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset-row > * { flex: 1 1 140px; }
  .preset-row + .preset-row { margin-top: 8px; }

  /* ===== Library ===== */
  .lib-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip-btn { border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: var(--text-dim); border-radius: 99px; padding: 7px 12px; font-size: 0.8em; cursor: pointer; min-height: 34px; }
  .chip-btn.active { background: var(--gold); color: #1a1a1a; border-color: var(--gold); font-weight: 700; }
  .lib-cat { margin-bottom: 14px; }
  .lib-cat h3 { font-size: 0.8em; text-transform: uppercase; letter-spacing: 1.2px; color: var(--gold); margin-bottom: 6px; }
  .lib-item { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--card-border); margin-bottom: 6px; }
  .lib-item .lib-text { flex: 1; min-width: 0; }
  .lib-item .lib-name { font-weight: 700; font-size: 0.92em; }
  .lib-item .lib-tip { color: var(--text-dim); font-size: 0.8em; margin-top: 2px; }
  .lib-item .lib-meta { margin-top: 4px; display: flex; gap: 5px; flex-wrap: wrap; }
  .lib-add { background: var(--gold); color: #1a1a1a; border: 0; width: 38px; height: 38px; border-radius: 10px; font-size: 1.3em; font-weight: 800; cursor: pointer; flex-shrink: 0; }
  .lib-add.added { background: var(--green); }

  /* ===== Summary ===== */
  .summary-list { list-style: none; }
  .summary-list li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--card-border); font-size: 0.9em; }
  .summary-list li:last-child { border-bottom: 0; }
  .summary-list .s-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .summary-list .s-time { color: var(--text-dim); }
  .status { font-size: 0.72em; padding: 3px 8px; border-radius: 99px; font-weight: 700; }
  .status-pending { background: rgba(255,255,255,0.08); color: var(--text-dim); }
  .status-current { background: rgba(255,215,0,0.18); color: var(--gold); }
  .status-done { background: rgba(0,217,126,0.15); color: var(--green); }
  .summary-total { display: flex; justify-content: space-between; margin-top: 8px; font-weight: 700; }

  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  footer { max-width: 1200px; margin: 18px auto 0; text-align: center; color: var(--text-dim); font-size: 0.75em; }

  /* ===== Celebration ===== */
  .celebration-overlay { display: none; position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(0,0,0,0.7), rgba(0,0,0,0.95)); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
  .celebration-overlay.show { display: flex; }
  .celebration-text { font-size: 2.5em; color: var(--gold); text-shadow: 0 0 30px rgba(255,215,0,0.6); font-weight: 800; text-align: center; animation: bounce-in 0.6s ease-out; line-height: 1.1; }
  @keyframes bounce-in { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
  .celebration-sub { font-size: 1.1em; margin-top: 16px; text-align: center; animation: fade-in 1s 0.3s both; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .celebration-close { margin-top: 30px; animation: fade-in 1s 0.9s both; }
  #fireworksCanvas { position: fixed; inset: 0; z-index: 999; pointer-events: none; display: none; }
  #fireworksCanvas.show { display: block; }
  .confetti-piece { position: fixed; width: 10px; height: 14px; top: -20px; z-index: 1001; pointer-events: none; animation: confetti-fall linear forwards; }
  @keyframes confetti-fall { to { top: 110vh; transform: rotate(720deg); } }

  /* ===== Mobile ===== */
  @media (max-width: 899px) {
    body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .desktop-only { display: none !important; }
    .controls {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; margin: 0;
      background: rgba(10,10,20,0.92);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--card-border);
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      flex-wrap: nowrap;
    }
    .controls .btn { flex: 1 1 0; min-width: 0; min-height: 54px; padding: 8px 6px; font-size: 0.92em; }
  }
  @media (max-width: 420px) {
    .brand h1 { font-size: 1.35em; }
    .countdown { font-size: 3.4em; }
    .kc-key { font-size: 2.8em; }
    .controls .btn .lbl-opt { display: none; }
    .unit-details, .settings-grid { grid-template-columns: 1fr; }
    .unit-min { width: 60px !important; }
    .unit-actions { margin-left: auto; }
  }

  /* ===== Desktop ===== */
  @media (min-width: 900px) {
    body { padding: 24px 24px 40px; }
    .brand h1 { font-size: 2em; }
    .layout { grid-template-columns: minmax(380px, 460px) 1fr; gap: 20px; align-items: start; }
    .col-left { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; scrollbar-width: thin; }
    .countdown { font-size: 4.8em; }
    .mobile-only { display: none !important; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <h1>&#9835; Practice Pal</h1>
    <p class="subtitle" data-i18n="subtitle"></p>
  </div>
  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="de" onclick="setLang('de')">DE</button>
    <button type="button" data-lang="en" onclick="setLang('en')">EN</button>
  </div>
</header>

<main class="layout">
  <!-- ===== Left column: timer + metronome ===== -->
  <div class="col col-left">
    <section class="card timer-card">
      <div class="screen-on" data-i18n="screenOn"></div>
      <div class="current-label" id="currentLabel"></div>
      <div class="current-practice" id="currentPractice">-</div>
      <div class="current-tip" id="currentTip"></div>
      <div class="countdown" id="countdown">00:00</div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="total"><span data-i18n="totalTime"></span><b id="totalTime">00:00</b></div>

      <div class="keycycle" id="keyCycle" style="display:none">
        <div class="kc-head"><span id="kcLabel"></span><span id="kcRound"></span></div>
        <div class="kc-main">
          <div class="kc-key" id="kcKey">C</div>

function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]);

  if (vars && typeof s === 'string') Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });

}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const NOTES_INTL = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const NOTES_DE = ['C', 'Des', 'D', 'Es', 'E', 'F', 'Ges', 'G', 'As', 'A', 'B', 'H'];
function noteName(pc) {
  pc = ((pc % 12) + 12) % 12;
  if (pc === 6 && settings.sharp6) return settings.notation === 'de' ? 'Fis' : 'F#';
  return (settings.notation === 'de' ? NOTES_DE : NOTES_INTL)[pc];
}

// =====================================================================
// Key cycles ("durch alle Tonarten")
// Every interval produces a sequence through all 12 keys. If the interval
// does not reach all 12 keys on its own (2nds, 3rds, tritone, 6ths), the
// sequence continues one semitone higher until every key has appeared.
// =====================================================================
const INTERVALS = [1, 2, 3, 4, 5, 6, 7, 8, 9];
function gcd(a, b) { return b ? gcd(b, a % b) : a; }
function keySequence(semi, start) {
  const g = gcd(semi, 12), len = 12 / g, seq = [], groups = [];
  for (let k = 0; k < g; k++) {
    for (let j = 0; j < len; j++) seq.push((start + k + j * semi) % 12);
    groups.push(len);
  }
  return { seq, groupLen: len };
}

// =====================================================================

// =====================================================================
const LIB = {};
const LIB_ORDER = [];
function L(id, cat, tags, minutes, name, tip, extra) {
  const item = Object.assign({ id, cat, tags, minutes, name: { de: name[0], en: name[1] }, tip: { de: tip[0], en: tip[1] } }, extra || {});
  if (item.cy) { item.cycle = { semi: item.cy[0], start: 0, mode: item.cy[1] || 'manual', bars: item.cy[2] || 4 }; delete item.cy; }
  LIB[id] = item; LIB_ORDER.push(id);
}

function makeUnitFromLib(libId, minutes) {
  const it = LIB[libId];
  return {
    id: ++unitCounter,
    lib: libId,
    name: it.name[lang],
    tip: it.tip[lang],
    minutes: minutes || it.minutes,
    bpm: it.bpm || null,
    cycle: it.cycle ? Object.assign({}, it.cycle) : null
  };
}
function normalizeUnit(s) {
  return {
    id: ++unitCounter,
    lib: s.lib || null,
    name: s.name || '',
    tip: s.tip || '',
    minutes: Math.max(1, parseInt(s.minutes, 10) || 1),
    bpm: s.bpm ? clampInt(s.bpm, 20, 300) : null,

    const secondsLeft = Math.ceil(remainingSeconds);
    if (secondsLeft <= 3 && secondsLeft > 0 && secondsLeft !== lastBeepSecond) {

    if (remainingSeconds <= 0) {

      currentIndex++;
      if (currentIndex >= units.length) { finishPractice(); return; }
      startCurrentSection();

    timerRafId = requestAnimationFrame(tick);
  }

  else if (key === 'bpm') { u.bpm = value === '' ? null : clampInt(value, 20, 300); }
  else if (key === 'cycleSemi') {
    if (value === '') u.cycle = null;
    else u.cycle = Object.assign({ start: 0, mode: 'manual', bars: 4 }, u.cycle || {}, { semi: parseInt(value, 10) });
  }
  else if (key === 'cycleStart' && u.cycle) u.cycle.start = parseInt(value, 10);
  else if (key === 'cycleMode' && u.cycle) u.cycle.mode = value;
  else if (key === 'cycleBars' && u.cycle) u.cycle.bars = clampInt(value, 1, 64);
  if (rerender) renderUnits();
  renderSummary(); renderSectionJumper();
  if (!isRunning && !isPaused) updateTimerDisplay();
  if ((isRunning || isPaused) && units[currentIndex] === u && key.startsWith('cycle')) { resetCycle(); }
}

function cycleTag(c) {
  return '🔁 ' + t('intervalsShort')[c.semi] + ' · ' + t('from') + ' ' + noteName(c.start || 0);
}
function renderUnits() {
  const list = document.getElementById('unitsList');
  const active = isRunning || isPaused;
  let html = '';
  units.forEach((u, idx) => {
    const cls = active ? (idx === currentIndex ? ' current' : (idx < currentIndex ? ' completed' : '')) : '';
    const open = openDetails.has(u.id);
    const tags = [];
    if (u.cycle) tags.push('<span class="tag cycle">' + esc(cycleTag(u.cycle)) + '</span>');
    if (u.bpm) tags.push('<span class="tag bpm">♩ ' + u.bpm + '</span>');
    if (u.tip && !open) tags.push('<span class="tag" title="' + esc(u.tip) + '">💡 ' + esc(u.tip.length > 48 ? u.tip.slice(0, 46) + '…' : u.tip) + '</span>');

    html += '<div class="unit' + cls + '">' +
      '<div class="unit-top">' +
        '<span class="unit-num">' + (idx + 1) + '</span>' +
        '<input type="text" class="unit-name" value="' + esc(u.name) + '" placeholder="' + esc(t('unitNamePh')) + '" oninput="updateUnit(' + u.id + ',\'name\',this.value)">' +
        '<input type="number" class="unit-min" min="1" max="240" inputmode="numeric" value="' + u.minutes + '" onchange="updateUnit(' + u.id + ',\'minutes\',this.value,true)" aria-label="' + esc(t('min')) + '">' +
        '<span class="unit-min-label">' + esc(t('min')) + '</span>' +
      '</div>' +
      '<div class="unit-bottom">' +
        '<div class="unit-tags">' + tags.join('') + '</div>' +
        '<div class="unit-actions">' +
          '<button class="icon-btn" onclick="moveUnit(' + u.id + ',-1)" title="' + esc(t('moveUp')) + '" aria-label="' + esc(t('moveUp')) + '">↑</button>' +
          '<button class="icon-btn" onclick="moveUnit(' + u.id + ',1)" title="' + esc(t('moveDown')) + '" aria-label="' + esc(t('moveDown')) + '">↓</button>' +
          '<button class="icon-btn' + (open ? ' on' : '') + '" onclick="toggleDetails(' + u.id + ')" title="' + esc(t('details')) + '" aria-label="' + esc(t('details')) + '">⚙</button>' +
          '<button class="icon-btn danger" onclick="removeUnit(' + u.id + ')" title="' + esc(t('remove')) + '" aria-label="' + esc(t('remove')) + '">✕</button>' +
        '</div>' +
      '</div>';

    if (open) {
      const c = u.cycle;
      let semiOpts = '<option value="">' + esc(t('cycleNone')) + '</option>';
      INTERVALS.forEach(s => { semiOpts += '<option value="' + s + '"' + (c && c.semi === s ? ' selected' : '') + '>' + esc(t('intervals')[s]) + '</option>'; });
      let keyOpts = '';
      for (let k = 0; k < 12; k++) keyOpts += '<option value="' + k + '"' + (c && (c.start || 0) === k ? ' selected' : '') + '>' + esc(noteName(k)) + '</option>';
      const modes = [['manual', 'modeManual'], ['time', 'modeTime'], ['bars', 'modeBars']];
      let modeOpts = '';
      modes.forEach(([v, k]) => { modeOpts += '<option value="' + v + '"' + (c && c.mode === v ? ' selected' : '') + '>' + esc(t(k)) + '</option>'; });

      html += '<div class="unit-details">' +
        '<label class="field full"><span>' + esc(t('tip')) + '</span><textarea placeholder="' + esc(t('tipPh')) + '" oninput="updateUnit(' + u.id + ',\'tip\',this.value)">' + esc(u.tip) + '</textarea></label>' +
        '<label class="field"><span>' + esc(t('unitBpm')) + '</span><input type="number" min="20" max="300" inputmode="numeric" value="' + (u.bpm || '') + '" placeholder="' + esc(t('unitBpmPh')) + '" onchange="updateUnit(' + u.id + ',\'bpm\',this.value,true)"></label>' +
        '<label class="field"><span>🔁 ' + esc(t('cycle')) + '</span><select onchange="updateUnit(' + u.id + ',\'cycleSemi\',this.value,true)">' + semiOpts + '</select></label>';
      if (c) {
        html += '<label class="field"><span>' + esc(t('startKey')) + '</span><select onchange="updateUnit(' + u.id + ',\'cycleStart\',this.value,true)">' + keyOpts + '</select></label>' +
          '<label class="field"><span>' + esc(t('cycleMode')) + '</span><select onchange="updateUnit(' + u.id + ',\'cycleMode\',this.value,true)">' + modeOpts + '</select></label>';
        if (c.mode === 'bars') {
          html += '<label class="field"><span>' + esc(t('barsPerKey')) + '</span><input type="number" min="1" max="64" inputmode="numeric" value="' + (c.bars || 4) + '" onchange="updateUnit(' + u.id + ',\'cycleBars\',this.value,true)"></label>';
        }
        const seq = keySequence(c.semi, c.start || 0);
        html += '<div class="field full"><span>' + seq.seq.map((pc, j) => (j > 0 && seq.groupLen < 12 && j % seq.groupLen === 0 ? ' | ' : (j > 0 ? ' · ' : '')) + esc(noteName(pc))).join('') + '</span></div>';
      }
      html += '</div>';
    }
    html += '</div>';
  });
  list.innerHTML = html;
  const planned = units.reduce((a, u) => a + (u.minutes || 0), 0);
  document.getElementById('unitsHint').textContent = units.length ? ' · ' + planned + ' ' + t('min') : '';
}

function renderSummary() {
  const list = document.getElementById('summaryList');
  const active = isRunning || isPaused;
  let html = '';
  units.forEach((u, idx) => {
    let cls = 'status-pending', txt = t('pending');
    if (active && idx === currentIndex) { cls = 'status-current'; txt = t('active'); }
    else if (active && idx < currentIndex) { cls = 'status-done'; txt = t('done'); }
    html += '<li><span class="s-name">' + (idx + 1) + '. ' + esc(displayName(u, idx)) + '</span><span class="s-time">' + u.minutes + ' ' + esc(t('min')) + '</span><span class="status ' + cls + '">' + esc(txt) + '</span></li>';
  });
  list.innerHTML = html;
  const planned = units.reduce((a, u) => a + (u.minutes || 0), 0);
  document.getElementById('plannedTotal').textContent = planned + ' ' + t('min');
}

function renderSectionJumper() {
  const el = document.getElementById('sectionJumper');
  const active = isRunning || isPaused;
  el.innerHTML = '';
  units.forEach((u, idx) => {
    const b = document.createElement('button');
    if (active && idx === currentIndex) b.className = 'active';
    else if (active && idx < currentIndex) b.className = 'done';
    b.textContent = (idx + 1) + '. ' + displayName(u, idx);
    b.title = b.textContent;
    b.onclick = () => jumpToSection(idx);
    el.appendChild(b);
  });
}

// =====================================================================
// Library UI
// =====================================================================
function setLibFilter(tag) { libFilter = tag; renderLibrary(); }
function renderLibrary() {
  const f = document.getElementById('libFilter');
  let fh = '<button class="chip-btn' + (libFilter === 'all' ? ' active' : '') + '" onclick="setLibFilter(\'all\')">' + esc(t('all')) + '</button>';
  TAG_ORDER.forEach(tag => { fh += '<button class="chip-btn' + (libFilter === tag ? ' active' : '') + '" onclick="setLibFilter(\'' + tag + '\')">' + esc(t('tags')[tag]) + '</button>'; });
  f.innerHTML = fh;

  const list = document.getElementById('libList');
  let html = '';
  CAT_ORDER.forEach(cat => {
    const items = LIB_ORDER.map(id => LIB[id]).filter(it => it.cat === cat && (libFilter === 'all' || it.tags.includes(libFilter) || it.tags.includes('all')));
    if (!items.length) return;
    html += '<div class="lib-cat"><h3>' + esc(t('cats')[cat]) + '</h3>';
    items.forEach(it => {
      const meta = ['<span class="tag">' + it.minutes + ' ' + esc(t('min')) + '</span>'];
      if (it.cycle) meta.push('<span class="tag cycle">' + esc(cycleTag(it.cycle)) + '</span>');
      if (it.bpm) meta.push('<span class="tag bpm">♩ ' + it.bpm + '</span>');
      html += '<div class="lib-item"><div class="lib-text"><div class="lib-name">' + esc(it.name[lang]) + '</div><div class="lib-tip">' + esc(it.tip[lang]) + '</div><div class="lib-meta">' + meta.join('') + '</div></div>' +
        '<button class="lib-add" onclick="addFromLibrary(\'' + it.id + '\', this)" aria-label="+">+</button></div>';
    });
    html += '</div>';
  });
  list.innerHTML = html;
}

// =====================================================================
// Presets (localStorage keys practicePresets / practiceDefault kept compatible)
// =====================================================================
function getUserPresets() { try { return JSON.parse(localStorage.getItem('practicePresets') || '{}'); } catch (e) { return {}; } }
function presetDisplayName() {
  if (!currentPresetRef) return document.getElementById('presetName').value.trim();
  if (currentPresetRef.type === 'builtin') { const p = BUILTIN.find(b => b.id === currentPresetRef.id); return p ? p.name[lang] : ''; }
  return currentPresetRef.name;
}
function loadUnitsFromBuiltin(id) {
  const p = BUILTIN.find(b => b.id === id) || BUILTIN[0];
  units = p.units.map(([lib, min]) => makeUnitFromLib(lib, min));
  currentPresetRef = { type: 'builtin', id: p.id };
  document.getElementById('presetName').value = p.name[lang];
}
function loadUnitsFromData(data) {
  units = (data.sections || []).map(normalizeUnit);
  retranslateUnits();
  currentPresetRef = { type: 'user', name: data.name || '' };
  document.getElementById('presetName').value = data.name || '';
}
function afterPresetLoad() {
  openDetails.clear();
  stopTimer();
  renderPresetSelect();
}
function loadSelectedPreset() {
  const v = document.getElementById('presetSelect').value;
  if (!v) return;
  if (v.startsWith('b:')) loadUnitsFromBuiltin(v.slice(2));
  else {
    const p = getUserPresets()[v.slice(2)];
    if (!p) return;
    loadUnitsFromData(p);
  }
  afterPresetLoad();
}
function savePreset() {
  const name = document.getElementById('presetName').value.trim();
  if (!name) { alert(t('alertName')); return; }
  const presets = getUserPresets();
  presets[name] = { name, sections: units.map(unitForStorage) };
  localStorage.setItem('practicePresets', JSON.stringify(presets));
  currentPresetRef = { type: 'user', name };
  renderPresetSelect();
  alert(t('alertSaved', { n: name }));
}
function saveAsDefaultPreset() {
  const name = document.getElementById('presetName').value.trim() || presetDisplayName() || 'Practice Pal';
  localStorage.setItem('practiceDefault', JSON.stringify({ name, sections: units.map(unitForStorage) }));
  alert(t('alertDefault', { n: name }));
}
function deletePreset() {
  const v = document.getElementById('presetSelect').value;
  if (v.startsWith('b:')) { alert(t('alertBuiltin')); return; }
  if (!v.startsWith('u:')) { alert(t('alertSelect')); return; }
  const name = v.slice(2);
  if (!confirm(t('confirmDelete', { n: name }))) return;
  const presets = getUserPresets();
  delete presets[name];
  localStorage.setItem('practicePresets', JSON.stringify(presets));
  if (currentPresetRef && currentPresetRef.type === 'user' && currentPresetRef.name === name) currentPresetRef = null;
  renderPresetSelect();
}
function loadDefaultPreset() {
  const saved = localStorage.getItem('practiceDefault');
  let data = null;
  try { data = saved ? JSON.parse(saved) : null; } catch (e) { data = null; }
  if (data && data.sections && data.sections.length) loadUnitsFromData(data);
  else loadUnitsFromBuiltin('jazzPiano');
  afterPresetLoad();
}
function renderPresetSelect() {
  const sel = document.getElementById('presetSelect');
  sel.innerHTML = '';
  const ph = document.createElement('option'); ph.value = ''; ph.textContent = t('choosePreset'); sel.appendChild(ph);
  const g1 = document.createElement('optgroup'); g1.label = t('builtinGroup');
  BUILTIN.forEach(p => { const o = document.createElement('option'); o.value = 'b:' + p.id; o.textContent = p.name[lang]; g1.appendChild(o); });
  sel.appendChild(g1);
  const user = getUserPresets();
  const names = Object.keys(user);
  if (names.length) {
    const g2 = document.createElement('optgroup'); g2.label = t('userGroup');
    names.forEach(n => { const o = document.createElement('option'); o.value = 'u:' + n; o.textContent = n; g2.appendChild(o); });
    sel.appendChild(g2);
  }
  sel.value = currentPresetRef ? (currentPresetRef.type === 'builtin' ? 'b:' + currentPresetRef.id : 'u:' + currentPresetRef.name) : '';
  if (sel.selectedIndex < 0) sel.value = '';
}

// =====================================================================
// Language & static texts
// =====================================================================
function setLang(l) {
  if (!I18N[l]) return;
  lang = l;
  localStorage.setItem('ppLang', l);
  retranslateUnits();
  if (currentPresetRef && currentPresetRef.type === 'builtin') {
    const p = BUILTIN.find(b => b.id === currentPresetRef.id);
    if (p) document.getElementById('presetName').value = p.name[lang];
  }
  renderAll();
}
function applyStaticTexts() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  document.title = 'Practice Pal – ' + t('subtitle');

  const ts = document.getElementById('timeSigSelect');
  ts.innerHTML = [[1, t('noBar')], [2, '2/4'], [3, '3/4'], [4, '4/4'], [5, '5/4'], [6, '6/8']].map(([v, l]) => '<option value="' + v + '">' + esc(l) + '</option>').join('');
  ts.value = metro.beats;
  const ac = document.getElementById('accentSelect');
  ac.innerHTML = [['one', t('accOne')], ['twofour', t('accTwoFour')], ['none', t('accNone')]].map(([v, l]) => '<option value="' + v + '">' + esc(l) + '</option>').join('');
  ac.value = metro.accent;
  document.getElementById('gapPlay').value = metro.playBars;
  document.getElementById('gapMute').value = metro.muteBars;

  const ns = document.getElementById('notationSelect');
  ns.innerHTML = '<option value="intl">' + esc(t('notIntl')) + '</option><option value="de">' + esc(t('notDe')) + '</option>';
  ns.value = settings.notation;
  const en = document.getElementById('enharmSelect');
  en.innerHTML = '<option value="0">' + esc(t('flat6')) + '</option><option value="1">' + esc(t('sharp6')) + '</option>';
  en.value = settings.sharp6 ? '1' : '0';
  const bs = document.getElementById('beepsSelect');
  bs.innerHTML = '<option value="1">' + esc(t('on')) + '</option><option value="0">' + esc(t('off')) + '</option>';
  bs.value = settings.beeps ? '1' : '0';
}
function renderAll() {
  applyStaticTexts();
  setControls();
  renderUnits();
  renderSummary();
  renderSectionJumper();
  renderLibrary();
  renderPresetSelect();
  updateTimerDisplay();
  renderCycle(false);
  renderMetroStatus();
}

function toggleSection(id) { document.getElementById(id).classList.toggle('collapsed'); }

// =====================================================================
// Keyboard shortcuts (desktop)
// =====================================================================
document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); if (isRunning && !isPaused) pauseTimer(); else startTimer(); }
  else if (e.key === 'ArrowRight') { if (cyc) { e.preventDefault(); nextKey(true); } }
  else if (e.key === 'm' || e.key === 'M') { const cb = document.getElementById('metronomeToggle'); cb.checked = !cb.checked; toggleMetronome(); }
  else if (e.key === 't' || e.key === 'T') { tapTempo(); }
});

// =====================================================================
// Celebration (applause + fireworks + confetti)
// =====================================================================
function showCelebration() { document.getElementById('celebrationOverlay').classList.add('show'); }
function closeCelebration() {
  document.getElementById('celebrationOverlay').classList.remove('show');
  document.getElementById('fireworksCanvas').classList.remove('show');
  stopFireworks();
  document.querySelectorAll('.confetti-piece').forEach(el => el.remove());
  totalPracticeMs = 0; updateTotalTime();
}
function createConfetti() {
  const colors = ['#ffd700', '#ff6b6b', '#00d97e', '#4d8bff', '#c084fc', '#fb923c', '#06b6d4'];
  for (let i = 0; i < 100; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (Math.random() * 2.5 + 2) + 's';
    piece.style.animationDelay = Math.random() * 1.5 + 's';
    piece.style.width = (Math.random() * 8 + 6) + 'px';
    piece.style.height = (Math.random() * 12 + 10) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(piece);
  }
}
let fireworksCtx = null, fireworksRunning = false, fireworksParticles = [], fireworksRockets = [];
function startFireworks() {
  const canvas = document.getElementById('fireworksCanvas');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  canvas.classList.add('show');
  fireworksCtx = canvas.getContext('2d');
  fireworksRunning = true; fireworksParticles = []; fireworksRockets = [];
  for (let i = 0; i < 12; i++) setTimeout(() => launchRocket(), i * 400 + Math.random() * 200);
  requestAnimationFrame(fireworksLoop);
}
function stopFireworks() { fireworksRunning = false; fireworksParticles = []; fireworksRockets = []; }
function launchRocket() {
  if (!fireworksRunning) return;
  const canvas = document.getElementById('fireworksCanvas');
  const startX = Math.random() * canvas.width, startY = canvas.height;
  const targetY = canvas.height * (0.15 + Math.random() * 0.4);
  fireworksRockets.push({ x: startX, y: startY, targetY, vx: (Math.random() - 0.5) * 2, vy: -Math.sqrt(2 * 0.15 * (startY - targetY)) * 0.9, color: 'hsl(' + (Math.random() * 360) + ', 100%, 60%)', exploded: false });
}
function explodeFirework(x, y, color) {
  const n = 50 + Math.random() * 30;
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i) / n + Math.random() * 0.2, speed = 2 + Math.random() * 4;
    fireworksParticles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, color, life: 1, decay: 0.012 + Math.random() * 0.015, size: 2 + Math.random() * 2 });
  }
}
function fireworksLoop() {
  if (!fireworksRunning) return;
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = fireworksCtx;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  fireworksRockets.forEach(r => {
    if (r.exploded) return;
    r.x += r.vx; r.y += r.vy; r.vy += 0.05;
    ctx.beginPath(); ctx.arc(r.x, r.y, 2, 0, Math.PI * 2); ctx.fillStyle = r.color; ctx.fill();
    ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx, r.y - r.vy);
    ctx.strokeStyle = r.color; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.6; ctx.stroke(); ctx.globalAlpha = 1;
    if (r.y <= r.targetY || r.vy >= 0) { r.exploded = true; explodeFirework(r.x, r.y, r.color); }
  });
  fireworksRockets = fireworksRockets.filter(r => !r.exploded);
  fireworksParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.vx *= 0.99; p.vy *= 0.99; p.life -= p.decay;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life); ctx.fill();
  });
  ctx.globalAlpha = 1;
  fireworksParticles = fireworksParticles.filter(p => p.life > 0);
  if (Math.random() < 0.04) launchRocket();
  requestAnimationFrame(fireworksLoop);
}
window.addEventListener('resize', () => {
  const canvas = document.getElementById('fireworksCanvas');
  if (canvas.classList.contains('show')) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
});

// Service worker (PWA install + better background behaviour)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = "self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => self.clients.claim());";
    const url = URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' }));
    navigator.serviceWorker.register(url).catch(() => {});
  });
}
